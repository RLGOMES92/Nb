                <span>Estoque: <strong>{estoqueDoProd} un</strong> · {prazoSel} · {linhaSelecionada.faixaLabel} → <strong>{R$(linhaSelecionada.valorMensal)}/un/mês</strong></span>
              </div>
            )}
          </div>
        ) : (
          <div>
            <div className="form-row c2" style={{marginBottom:10}}>
              <Inp label="Nome do Produto" req value={nome} onChange={e=>setNome(e.target.value)} placeholder="Ex: Notebook Asus Vivobook"/>
              <Inp label="Especificação" value={spec} onChange={e=>setSpec(e.target.value)} placeholder="Ex: i5 / 8GB / 512GB"/>
            </div>
            <div className="form-row c2" style={{marginBottom:10}}>
              <Inp label="Fornecedor / Onde adquirir" value={fornecedor} onChange={e=>setFornecedor(e.target.value)} placeholder="Ex: Kabum / Magazine Luiza"/>
              <Inp label="Prazo (texto livre)" req value={prazoManual} onChange={e=>setPrazoManual(e.target.value)} placeholder='Ex: 12 meses'/>
            </div>
            <FG label="Preço Base / Unidade / Mês (R$)" req>
              <input className="input" style={{maxWidth:200}} placeholder="0,00" value={precoManual} onChange={e=>setPrecoManual(e.target.value)}/>
            </FG>
          </div>
        )}
      </div>
      <div className="card">
        <div className="card-title"><div className="icon">🔢</div>Quantidade</div>
        <div className="qty-stepper">
          <button className="qty-btn" onClick={()=>setQtd(q=>Math.max(1,(parseInt(q)||0)-1))}>−</button>
          <input className="qty-val" type="text" inputMode="numeric" pattern="[0-9]*" value={qtd}
            onChange={e=>{ const v=e.target.value.replace(/\D/g,''); setQtd(v===''?'':parseInt(v)); }}
            onBlur={()=>setQtd(q=>(!q||q<1)?1:q)}/>
          <button className="qty-btn" onClick={()=>setQtd(q=>(parseInt(q)||0)+1)}>+</button>
        </div>
        {aba==='estoque' && prodSel && qtd > estoqueDoProd && (
          <div className="ibox red" style={{marginTop:8,fontSize:11}}><span>⚠️</span>Qtd ({qtd}) supera o estoque ({estoqueDoProd} un).</div>
        )}
      </div>
      <div className="card">
        <div className="card-title"><div className="icon">🏷️</div>Desconto <span style={{fontSize:11,fontWeight:400,color:'var(--slate)'}}>(opcional)</span></div>
        <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
          <button className={`btn btn-sm${descTipo==='%'?' btn-primary':' btn-outline'}`} onClick={()=>setDescTipo('%')}>% Percentual</button>
          <button className={`btn btn-sm${descTipo==='$'?' btn-primary':' btn-outline'}`} onClick={()=>setDescTipo('$')}>R$ Nominal</button>
          <input className="input" style={{maxWidth:160}} placeholder={descTipo==='%'?'Ex: 5':'Ex: 20'} value={descVal} onChange={e=>setDescVal(e.target.value)}/>
        </div>
      </div>
      <button className="btn btn-success btn-lg" style={{width:'100%',marginBottom:14}} onClick={handleAdd}>＋ Adicionar à Lista</button>
      <div className="card">
        <div className="card-title"><div className="icon">📋</div>Itens do Orçamento ({itens.length})</div>
        {itens.length===0 ? (
          <div className="empty"><div className="eicon">📭</div><p>Nenhum item adicionado ainda.</p></div>
        ) : (
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {itens.map(item => (
              <div key={item.id} className="produto-row">
                <div className="produto-info">
                  <div className="produto-nome">{item.nome}</div>
                  <div className="produto-sub">
                    {item.spec&&<>{item.spec} · </>}
                    <span className="badge badge-blue" style={{margin:'0 4px'}}>{item.prazoLabel}</span>
                    {item.faixaLabel && <span className="badge badge-warn" style={{marginRight:4}}>{item.faixaLabel}</span>}
                    {item.origem==='Sob Demanda' && <span className="badge badge-ok" style={{marginRight:4}}>Sob Demanda</span>}
                    {item.fornecedor && <span style={{fontSize:10,color:'var(--slate)'}}>📍{item.fornecedor}</span>}
                  </div>
                  <div style={{display:'flex',gap:6,marginTop:4,flexWrap:'wrap',alignItems:'center'}}>
                    <span style={{fontSize:12,fontWeight:800,color:'var(--navy)'}}>{R$(item.precoFinal)}<span style={{fontSize:10,fontWeight:400,color:'var(--slate)'}}>/un</span></span>
                    <span style={{fontSize:11,color:'var(--slate-light)'}}>×</span>
                    <span style={{fontSize:11,fontWeight:700,color:'var(--slate)'}}>{item.quantidade} un</span>
                    <span style={{fontSize:11,color:'var(--slate-light)'}}>=</span>
                    <span style={{fontSize:12,fontWeight:800,color:'var(--electric)'}}>{R$(item.valorMensal)}<span style={{fontSize:10,fontWeight:400,color:'var(--slate)'}}>/mês</span></span>
                  </div>
                </div>
                <button className="btn btn-warn btn-icon" onClick={()=>setEditItem(item)} title="Editar">✏️</button>
                <button className="btn btn-ghost btn-icon" onClick={()=>onRemoveItem(item.id)} title="Remover">🗑️</button>
              </div>
            ))}
          </div>
        )}
      </div>
      <div className="nav-btns">
        <button className="btn btn-outline btn-lg" onClick={onBack}>← Voltar</button>
        <button className="btn btn-primary btn-lg" onClick={()=>{if(itens.length===0){toast('Adicione ao menos um produto.','error');return;}onNext();}}>Ver Resumo →</button>
      </div>
      {editItem && (
        <ModalEditarItem item={editItem}
          onSave={u=>{onEditItem(u);setEditItem(null);toast('Item atualizado!','success')}}
          onClose={()=>setEditItem(null)}/>
      )}
    </div>
  );
}

function ModalEditarItem({item, onSave, onClose}) {
  const [qtd, setQtd]           = useState(item.quantidade);
  const [prazoLabel, setPrazoL] = useState(item.prazoLabel);
  const [preco, setPreco]       = useState(item.precoBase);
  const [dT, setDT]             = useState(item.descTipo||'%');
  const [dV, setDV]             = useState(item.descValor||0);
  const pFin = aplicaDesc(preco, dT, parseFloat(dV)||0);
  const meses = extrairMeses(prazoLabel);
  const mensal = pFin * qtd; const total = mensal * meses;
  return (
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-title">✏️ Editar Item</div>
        <div className="modal-sub">{item.nome}</div>
        <div className="form-row c2" style={{marginBottom:10}}>
          <div className="form-group">
            <div className="label">Quantidade</div>
            <div className="qty-stepper" style={{width:'100%'}}>
              <button className="qty-btn" onClick={()=>setQtd(q=>Math.max(1,(parseInt(q)||0)-1))}>−</button>
              <input className="qty-val" type="text" inputMode="numeric" pattern="[0-9]*" value={qtd}
                onChange={e=>{ const v=e.target.value.replace(/\D/g,''); setQtd(v===''?'':parseInt(v)); }}
                onBlur={()=>setQtd(q=>(!q||q<1)?1:q)}/>
              <button className="qty-btn" onClick={()=>setQtd(q=>(parseInt(q)||0)+1)}>+</button>
            </div>
          </div>
          <Inp label="Prazo (texto)" value={prazoLabel} onChange={e=>setPrazoL(e.target.value)}/>
        </div>
        <div className="form-row c2" style={{marginBottom:10}}>
          <Inp label="Preço Unit./Mês (R$)" type="number" min="0" step="0.01" value={preco} onChange={e=>setPreco(parseFloat(e.target.value)||0)}/>
          <div className="form-group">
            <div className="label">Desconto</div>
            <div style={{display:'flex',gap:6}}>
              <button className={`btn btn-sm${dT==='%'?' btn-primary':' btn-outline'}`} onClick={()=>setDT('%')}>%</button>
              <button className={`btn btn-sm${dT==='$'?' btn-primary':' btn-outline'}`} onClick={()=>setDT('$')}>R$</button>
              <input className="input" style={{flex:1}} type="number" min="0" step="0.01" value={dV} onChange={e=>setDV(e.target.value)}/>
            </div>
          </div>
        </div>
        <div className="ibox green"><span>📊</span><div>Preço final: <strong>{R$(pFin)}/un</strong> · Mensal: <strong>{R$(mensal)}</strong> · Total ({meses}m): <strong>{R$(total)}</strong></div></div>
        <div className="modal-btns">
          <button className="btn btn-outline" style={{flex:1}} onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" style={{flex:2}} onClick={()=>onSave({...item,quantidade:qtd,prazoLabel,prazoMeses:meses,precoBase:preco,precoFinal:pFin,descTipo:dT,descValor:parseFloat(dV)||0,valorMensal:mensal,valorTotal:total})}>💾 Salvar</button>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   PASSO 3 — RESUMO + PDF + SALVAR NO HISTÓRICO
══════════════════════════════════════════ */
function Passo3({orcamentoId, cliente, itens, catalogo, setCatalogo, config, onBack, onSalvarHistorico, onGerarContrato, toast}) {
  const [pdfGerado, setPdfGerado] = useState(false);
  const [pdfUrl,    setPdfUrl]    = useState(null);
  const [loading,   setLoading]   = useState(false);
  const [salvo, setSalvo] = useState(false);
  const [modalContrato, setModalContrato] = useState(false);
  const [contratoGerado, setContratoGerado] = useState(false);

  const prazos   = [...new Set(itens.map(i=>i.prazoLabel))];
  const produtos = [...new Map(itens.map(i=>[i.idProd||i.nome, i])).values()];
  const totais   = prazos.map(pz => { const ip=itens.filter(i=>i.prazoLabel===pz); const m=ip.reduce((s,i)=>s+i.valorMensal,0); const meses=extrairMeses(pz); return {prazo:pz,mensal:m,total:m*meses}; });

  const handlePDF = () => {
    setLoading(true);
    setTimeout(()=>{
      try {
        const doc = gerarPDF({id:orcamentoId}, cliente, itens, config);
        const url = URL.createObjectURL(doc.output('blob'));
        setPdfUrl(url); setPdfGerado(true); toast('PDF gerado!','success');
      } catch(e) { toast('Erro ao gerar PDF.','error'); console.error(e); }
      finally { setLoading(false); }
    }, 500);
  };

  const handleAbrirGerarContrato = () => {
    if (prazos.length <= 1) { confirmarContrato(prazos[0]); return; }
    setModalContrato(true);
  };

  const confirmarContrato = (prazoEscolhido) => {
    const itensDoPrazo = itens.filter(i=>i.prazoLabel===prazoEscolhido);
    const totalDoPrazo = totais.find(t=>t.prazo===prazoEscolhido)?.mensal || 0;
    // reduz estoque só das quantidades referentes ao prazo que o cliente realmente fechou
    const ag = {};
    itensDoPrazo.filter(i=>i.idProd).forEach(i=>{ ag[i.idProd] = (ag[i.idProd]||0) + i.quantidade; });
    setCatalogo(prev => prev.map(p => ag[p.id] ? {...p, qtdEstoque:Math.max(0,p.qtdEstoque-ag[p.id])} : p));
    onGerarContrato(
      { id:orcamentoId, cliente, itens, criadoEm:new Date().toISOString(), totalMensal: totais[0]?.mensal||0, prazos },
      prazoEscolhido, itensDoPrazo, totalDoPrazo
    );
    setModalContrato(false);
    setContratoGerado(true);
    toast('📝 Contrato gerado a partir do orçamento! Estoque atualizado.','success');
  };

  const handleSalvarHistorico = () => {
    onSalvarHistorico({ id:orcamentoId, cliente, itens, criadoEm:new Date().toISOString(),
      totalMensal: totais[0]?.mensal||0, prazos });
    setSalvo(true);
    toast('💾 Orçamento salvo no histórico!','success');
  };

  const handleDownload = () => {
    if(!pdfUrl) return;
    const a=document.createElement('a'); a.href=pdfUrl;
    a.download = `${orcamentoId}_${(cliente.nomeFantasia||cliente.razaoSocial||'cliente').replace(/\s+/g,'-')}.pdf`;
    a.click();
  };

  const handleWhatsApp = () => {
    const nomeVendedor = config.responsavelNome || '';
    const foneVendedor = config.responsavelCelular || '';
    const msg = encodeURIComponent(
      `Olá, ${cliente.responsavel}! 😊\n\nSegue a proposta *${orcamentoId}* referente à locação de notebooks.\n\n` +
      `📊 ${prazos.length} opção(ões) de prazo para comparar!\n\n` +
      `Proposta gerada em ${new Date().toLocaleDateString('pt-BR')}. Qualquer dúvida entre em contato!\n\n` +
      `${nomeVendedor ? `👤 ${nomeVendedor}\n` : ''}📱 ${foneVendedor}`
    );
    const foneCliente = cliente.telefone.replace(/\D/g,'');
    window.open(`https://wa.me/55${foneCliente}?text=${msg}`, '_blank');
  };

  return (
    <div>
      <div className="card" style={{background:'linear-gradient(135deg,var(--navy),var(--navy-light))',border:'none'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
          <div>
            <div style={{color:'rgba(255,255,255,.6)',fontSize:10,textTransform:'uppercase',letterSpacing:'.5px',marginBottom:3}}>Proposta</div>
            <div style={{color:'white',fontWeight:800,fontSize:20,letterSpacing:'-.3px'}}>{orcamentoId}</div>
            <div style={{color:'rgba(255,255,255,.5)',fontSize:11,marginTop:3}}>Válida até {new Date(Date.now()+30*86400000).toLocaleDateString('pt-BR')}</div>
          </div>
          <div style={{textAlign:'right'}}>
            <div style={{color:'rgba(255,255,255,.5)',fontSize:10}}>Emitida em</div>
            <div style={{color:'white',fontWeight:700,fontSize:13}}>{new Date().toLocaleDateString('pt-BR')}</div>
            <div style={{color:'rgba(255,255,255,.6)',fontSize:11,marginTop:4}}>{config.nomeEmpresa||'Urban Store'}</div>
          </div>
        </div>
      </div>

      <div className="card">
        <div className="card-title"><div className="icon">🏢</div>Cliente</div>
        <div style={{fontWeight:700,fontSize:14,color:'var(--navy)',marginBottom:4}}>{cliente.razaoSocial||cliente.nomeFantasia||'—'}</div>
        {cliente.cnpj&&<div style={{fontSize:11,color:'var(--slate)',marginBottom:6}}>CNPJ: {cliente.cnpj}</div>}
        <div className="divider" style={{margin:'8px 0'}}/>
        <div style={{fontSize:12,display:'flex',gap:14,flexWrap:'wrap'}}>
          <span>👤 {cliente.responsavel}</span><span>✉️ {cliente.email}</span><span>📱 {cliente.telefone}</span>
        </div>
      </div>

      <div className="card">
        <div className="card-title"><div className="icon">📊</div>Tabela Comparativa</div>
        <div style={{overflowX:'auto'}}>
          <table className="resumo-table">
            <thead><tr><th>Produto</th><th>Qtd</th>{prazos.map(pz=><th key={pz}>{pz}</th>)}</tr></thead>
            <tbody>
              {produtos.map(prod=>(
                <tr key={prod.idProd||prod.nome}>
                  <td>
                    <div style={{fontWeight:700,fontSize:11}}>{prod.nome}</div>
                    {prod.spec&&<div style={{fontSize:10,color:'var(--slate)'}}>{prod.spec}</div>}
                    {prod.origem==='Sob Demanda'&&<div style={{fontSize:10,color:'var(--success)'}}>Sob Demanda</div>}
                  </td>
                  <td style={{fontWeight:700}}>{prod.quantidade}</td>
                  {prazos.map(pz=>{
                    const item=itens.find(i=>(i.idProd||i.nome)===(prod.idProd||prod.nome)&&i.prazoLabel===pz);
                    return <td key={pz}>{item ? (
                        <div style={{lineHeight:1.7}}>
                          <div style={{fontWeight:800,color:'var(--navy)',fontSize:12}}>{R$(item.precoFinal)}<span style={{fontSize:9,fontWeight:400,color:'var(--slate)'}}>/un</span></div>
                          {item.faixaLabel && <div style={{fontSize:9,color:'var(--slate)'}}>{item.faixaLabel}</div>}
                          <div style={{fontSize:10,color:'var(--slate)',fontWeight:600}}>{R$(item.valorMensal)}/mês</div>
                        </div>
                      ) : <span className="no-col">—</span>}</td>;
                  })}
                </tr>
              ))}
            </tbody>
            <tfoot>
              <tr><td colSpan={2}>Mensalidade Total</td>{totais.map(t=><td key={t.prazo} style={{fontWeight:700,color:'var(--electric)'}}>{R$(t.mensal)}</td>)}</tr>
              <tr><td colSpan={2}>Total do Contrato</td>{totais.map(t=><td key={t.prazo}>{R$(t.total)}</td>)}</tr>
            </tfoot>
          </table>
        </div>
      </div>

      <div className="card" style={{textAlign:'center'}}>
        <div style={{display:'flex',gap:12,justifyContent:'center',flexWrap:'wrap',marginBottom:14}}>
          <button className="btn btn-outline btn-lg" onClick={handleSalvarHistorico} disabled={salvo}>
            {salvo?'✅ Salvo no Histórico':'💾 Salvar no Histórico'}
          </button>
        </div>
        {!pdfGerado ? (
          <div>
            <div style={{fontSize:12,color:'var(--slate)',marginBottom:18}}>O PDF usará os dados configurados em ⚙️ (logo, responsável, textos).</div>
            <button className="btn btn-primary btn-xl" onClick={handlePDF} disabled={loading}>
              {loading?<><div className="spinner"/>Gerando...</>:'📄 Gerar PDF'}
            </button>
          </div>
        ) : (
          <div className="pdf-success">
            <span className="big">📄</span>
            <h3>PDF Gerado!</h3>
            <p>Proposta <strong>{orcamentoId}</strong> pronta!</p>
            <div className="pdf-btns">
              <button className="btn btn-primary btn-lg" onClick={handleDownload}>⬇️ Baixar PDF</button>
              <button className="btn btn-success btn-lg" onClick={handleWhatsApp}>💬 WhatsApp</button>
              <a href={pdfUrl} target="_blank" rel="noreferrer"><button className="btn btn-outline btn-lg">🔍 Visualizar</button></a>
              <button className="btn btn-warn btn-lg" onClick={handleAbrirGerarContrato} disabled={contratoGerado}>
                {contratoGerado ? '✅ Contrato Gerado' : '📝 Gerar Contrato'}
              </button>
            </div>
          </div>
        )}
      </div>

      {modalContrato && (
        <div className="overlay" onClick={()=>setModalContrato(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modal-title">📝 Gerar Contrato</div>
            <div className="modal-sub">Qual opção de prazo o cliente fechou?</div>
            <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:6}}>
              {totais.map(t => (
                <button key={t.prazo} className="btn btn-outline" style={{width:'100%',justifyContent:'space-between',height:'auto',padding:'12px 14px'}} onClick={()=>confirmarContrato(t.prazo)}>
                  <span style={{fontWeight:700}}>{t.prazo}</span>
                  <span style={{fontWeight:800,color:'var(--electric)'}}>{R$(t.mensal)}/mês</span>
                </button>
              ))}
            </div>
            <div className="modal-btns">
              <button className="btn btn-outline" style={{flex:1}} onClick={()=>setModalContrato(false)}>Cancelar</button>
            </div>
          </div>
        </div>
      )}

      <div className="nav-btns"><button className="btn btn-outline btn-lg" onClick={onBack}>← Voltar</button></div>
    </div>
  );
}

/* ══════════════════════════════════════════
   WIZARD DE ORÇAMENTO
══════════════════════════════════════════ */
function TelaOrcamento({catalogo, setCatalogo, config, toast, orcamentoEditando, onSalvarHistorico, onGerarContrato, onLimparEdicao}) {
  const [step, setStep] = useState(1);
  const [orcId_, setOrcId_] = useState(() => orcamentoEditando?.id || orcId());
  const [cliente, setCliente] = useState(() => orcamentoEditando?.cliente || {cnpj:'',razaoSocial:'',nomeFantasia:'',statusReceita:'',responsavel:'',email:'',telefone:'',cidade:'',uf:''});
  const [itens, setItens] = useState(() => orcamentoEditando?.itens || []);

  useEffect(() => {
    if (orcamentoEditando) {
      setOrcId_(orcamentoEditando.id);
      setCliente(orcamentoEditando.cliente);
      setItens(orcamentoEditando.itens);
      setStep(2);
      onLimparEdicao && onLimparEdicao();
    }
    // eslint-disable-next-line
  }, [orcamentoEditando]);

  const steps = [{n:1,label:'Cliente'},{n:2,label:'Produtos'},{n:3,label:'Resumo'}];
  return (
    <div>
      <div className="stepper-wrap">
        <div className="stepper">
          {steps.map(s=>{
            const est = step===s.n?'active':step>s.n?'done':'';
            return (<div key={s.n} className={`step-item ${est}`}><div className="step-circle">{step>s.n?'✓':s.n}</div><div className="step-label">{s.label}</div></div>);
          })}
        </div>
      </div>
      <div className="main">
        {step===1 && <Passo1 dados={cliente} onChange={p=>setCliente(v=>({...v,...p}))} onNext={()=>setStep(2)} toast={toast}/>}
        {step===2 && <Passo2 catalogo={catalogo} itens={itens}
          onAddItem={item=>setItens(p=>[...p,item])}
          onRemoveItem={id=>setItens(p=>p.filter(i=>i.id!==id))}
          onEditItem={u=>setItens(p=>p.map(i=>i.id===u.id?u:i))}
          onBack={()=>setStep(1)} onNext={()=>setStep(3)} toast={toast}/>}
        {step===3 && <Passo3 orcamentoId={orcId_} cliente={cliente} itens={itens} catalogo={catalogo} setCatalogo={setCatalogo} config={config} onBack={()=>setStep(2)} onSalvarHistorico={onSalvarHistorico} onGerarContrato={onGerarContrato} toast={toast}/>}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   TELA HISTÓRICO — lista, editar, excluir
══════════════════════════════════════════ */
function TelaHistorico({orcamentos, setOrcamentos, onEditar, toast}) {
  const [confirmDel, setConfirmDel] = useState(null);
  const lista = Object.values(orcamentos||{}).sort((a,b)=> new Date(b.criadoEm||0) - new Date(a.criadoEm||0));
  const convertidos = lista.filter(o=>o.contratoGerado).length;

  const handleDelete = (id) => {
    setOrcamentos(prev => { const n = {...prev}; delete n[id]; return n; });
    setConfirmDel(null);
    toast('Orçamento removido do histórico.','info');
  };

  return (
    <div className="main">
      {lista.length > 0 && (
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(110px,1fr))',gap:10,marginBottom:14}}>
          <div className="metric-box"><div className="ml">Orçamentos</div><div className="mv" style={{color:'var(--navy)'}}>{lista.length}</div></div>
          <div className="metric-box"><div className="ml">Viraram Contrato</div><div className="mv" style={{color:'var(--success)'}}>{convertidos}</div></div>
        </div>
      )}
      <div className="card">
        <div className="card-title"><div className="icon">🗂️</div>Histórico de Orçamentos ({lista.length})</div>
        <div className="ibox blue" style={{marginBottom:14}}>
          <span>☁️</span><span>Todos os orçamentos salvos aqui sincronizam automaticamente entre seus dispositivos. Clique em <strong>Editar</strong> para carregar um orçamento e alterá-lo.</span>
        </div>
        {lista.length===0 ? (
          <div className="empty"><div className="eicon">🗂️</div><p>Nenhum orçamento salvo ainda. Salve um na aba Orçamento, Passo 3.</p></div>
        ) : (
          lista.map(o => (
            <div key={o.id} className="hist-card">
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:10,flexWrap:'wrap'}}>
                <div>
                  <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                    <div style={{fontWeight:800,color:'var(--navy)',fontSize:13}}>{o.id}</div>
                    {o.contratoGerado && <span className="badge badge-ok">✅ Contrato {o.contratoId}</span>}
                  </div>
                  <div style={{fontSize:12,color:'var(--text-mid)',marginTop:2}}>{o.cliente?.razaoSocial || o.cliente?.nomeFantasia || 'Cliente sem nome'}</div>
                  <div style={{fontSize:11,color:'var(--slate)',marginTop:2}}>
                    {(o.itens||[]).length} item(ns) · {(o.prazos||[]).join(', ')} · criado em {o.criadoEm?new Date(o.criadoEm).toLocaleDateString('pt-BR'):'—'}
                  </div>
                  {o.totalMensal>0 && <div style={{fontSize:12,fontWeight:700,color:'var(--electric)',marginTop:4}}>{R$(o.totalMensal)}/mês</div>}
                </div>
                <div style={{display:'flex',gap:6}}>
                  <button className="btn btn-warn btn-sm" onClick={()=>onEditar(o)}>✏️ Editar</button>
                  <button className="btn btn-danger btn-sm" onClick={()=>setConfirmDel(o)}>🗑️</button>
                </div>
              </div>
            </div>
          ))
        )}
      </div>
      {confirmDel && (
        <div className="overlay" onClick={()=>setConfirmDel(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modal-title">🗑️ Excluir Orçamento</div>
            <div className="modal-sub">Remover <strong>{confirmDel.id}</strong> do histórico? Essa ação não pode ser desfeita.</div>
            <div className="modal-btns">
              <button className="btn btn-outline" style={{flex:1}} onClick={()=>setConfirmDel(null)}>Cancelar</button>
              <button className="btn btn-danger" style={{flex:1}} onClick={()=>handleDelete(confirmDel.id)}>Excluir</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════
   APP ROOT — agora conectado ao Firebase
══════════════════════════════════════════ */
function AppLogado({user}) {
  const [tela, setTela] = useState('orcamento');
  const { toasts, toast } = useToast();
  const onSyncError = useCallback((err, path) => {
    if (err && err.code === 'PERMISSION_DENIED') {
      toast(`❌ Firebase negou acesso a "${path}". Verifique as Regras (Rules) do Realtime Database.`, 'error');
    } else {
      toast(`❌ Erro de sincronização em "${path}": ${err?.message||'desconhecido'}`, 'error');
    }
  }, [toast]);
  const [catalogo, setCatalogo, catLoaded]     = useFirebaseSync(user.uid, 'catalogo', CATALOGO_INICIAL, onSyncError);
  const [contratos, setContratos, ctrLoaded]   = useFirebaseSync(user.uid, 'contratos', [], onSyncError);
  const [config, setConfig, cfgLoaded]         = useFirebaseSync(user.uid, 'config', CONFIG_INICIAL, onSyncError);
  const [orcamentos, setOrcamentos, orcLoaded] = useFirebaseSync(user.uid, 'orcamentos', {}, onSyncError);
  const [orcamentoEditando, setOrcamentoEditando] = useState(null);

  const limite = config.alertaDiasContrato || 30;
  const numContratosAlerta = contratos.filter(c => diasParaVencer(c.inicio,c.meses) <= limite).length;
  const numEstoqueAlerta   = catalogo.filter(p => p.qtdEstoque===0 || p.qtdEstoque<=(config.alertaEstoqueMinimoQtd||3)).length;

  const salvarNoHistorico = (orc) => {
    setOrcamentos(prev => ({...(prev||{}), [orc.id]: orc}));
  };
  const criarContratoDoOrcamento = (orcamento, prazoEscolhido, itensDoPrazo, totalMensalDoPrazo) => {
    const novoContrato = {
      id: `CTR-${uid()}`,
      cliente: orcamento.cliente.razaoSocial || orcamento.cliente.nomeFantasia || 'Cliente',
      produto: itensDoPrazo.map(i=>i.nome).join(', '),
      qtd: itensDoPrazo.reduce((s,i)=>s+i.quantidade,0),
      meses: extrairMeses(prazoEscolhido),
      mensalidade: totalMensalDoPrazo,
      inicio: new Date().toISOString().slice(0,10),
      orcamentoId: orcamento.id,
    };
    setContratos(prev => [...prev, novoContrato]);
    setOrcamentos(prev => ({
      ...(prev||{}),
      [orcamento.id]: { ...orcamento, contratoGerado:true, contratoId:novoContrato.id, prazoFechado:prazoEscolhido }
    }));
  };
  const editarOrcamento = (orc) => { setOrcamentoEditando(orc); setTela('orcamento'); };

  const tudoCarregado = catLoaded && ctrLoaded && cfgLoaded && orcLoaded;

  const navItems = [
    { key:'orcamento', label:'Orçamento', icon:'📄' },
    { key:'historico',  label:'Histórico', icon:'🗂️' },
    { key:'contratos',  label:'Contratos', icon:'📋', notif:numContratosAlerta>0 },
    { key:'estoque',    label:'Estoque',   icon:'📦', notif:numEstoqueAlerta>0 },
    { key:'config',     label:'Config',    icon:'⚙️' },
  ];

  return (
    <div>
      <div className="topbar">
        <div className="topbar-brand">
          <div className="dot">💻</div>
          {config.nomeEmpresa || 'NB Diogo'}
        </div>
        <div className="topbar-status">
          <span className={`sync-dot ${firebaseReady?'on':'off'}`}/>{firebaseReady?'sincronizado':'offline'}
        </div>
      </div>

      <AlertBanner catalogo={catalogo} contratos={contratos} config={config}/>

      {!tudoCarregado ? (
        <div className="main"><div className="empty"><div className="spinner" style={{width:24,height:24,borderColor:'rgba(15,39,68,.2)',borderTopColor:'var(--navy)',margin:'0 auto'}}/><p style={{marginTop:10}}>Carregando dados da nuvem...</p></div></div>
      ) : (
        <>
          {tela==='orcamento' && <TelaOrcamento catalogo={catalogo} setCatalogo={setCatalogo} config={config} toast={toast}
            orcamentoEditando={orcamentoEditando} onSalvarHistorico={salvarNoHistorico} onGerarContrato={criarContratoDoOrcamento} onLimparEdicao={()=>setOrcamentoEditando(null)}/>}
          {tela==='historico' && <TelaHistorico orcamentos={orcamentos} setOrcamentos={setOrcamentos} onEditar={editarOrcamento} toast={toast}/>}
          {tela==='contratos' && <TelaContratos contratos={contratos} setContratos={setContratos} config={config} toast={toast}/>}
          {tela==='estoque'   && <TelaEstoque   catalogo={catalogo} setCatalogo={setCatalogo}   config={config} toast={toast}/>}
          {tela==='config'    && <TelaConfiguracoes config={config} setConfig={setConfig} toast={toast} user={user}/>}
        </>
      )}

      <div className="bottom-nav">
        {navItems.map(item => (
          <button key={item.key} className={`bn-item${tela===item.key?' active':''}`} onClick={()=>setTela(item.key)}>
            <div className="bn-icon-wrap">
              {item.icon}
              {item.notif && <div className="bn-notif"/>}
            </div>
            <div className="bn-label">{item.label}</div>
          </button>
        ))}
      </div>

      <Toast toasts={toasts}/>
    </div>
  );
}

function App() {
  const [user, setUser] = useState(undefined);
  const { toasts, toast } = useToast();

  useEffect(() => {
    if (!firebaseReady) { setUser(null); return; }
    const unsub = auth.onAuthStateChanged(u => setUser(u || null));
    return unsub;
  }, []);

  if (user === undefined) {
    return <div className="login-wrap"><div className="spinner" style={{width:28,height:28,borderColor:'rgba(255,255,255,.3)',borderTopColor:'white'}}/></div>;
  }
  if (!user) return <><TelaLogin toast={toast}/><Toast toasts={toasts}/></>;
  return <AppLogado user={user}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
